apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.rnmedia3playerdemo"
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }
}

dependencies {
    implementation "com.facebook.react:react-native:+"   // Required for RN
    implementation "androidx.media3:media3-exoplayer:1.4.1" // Example Media3 dependency
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
}
